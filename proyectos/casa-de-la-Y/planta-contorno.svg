<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="840" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Casa de la "Y" — Planta (en desarrollo)</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#777">Medidas en metros · Interior: SALA cargada · resto pendiente</text>

  <text x="662" y="105" font-size="12" fill="#3a7d3a" font-weight="bold">↑ al quincho</text>

  <!-- ================= FRONT PATIO (retiro) ================= -->
  <rect x="150" y="452" width="463" height="290" fill="#ece2cf" stroke="#cdbfa3" stroke-width="1.5"/>
  <text x="381" y="600" text-anchor="middle" font-size="13" fill="#8a7c5c">patio / retiro frontal</text>

  <!-- ================= LEFT PASSAGE ================= -->
  <rect x="150" y="110" width="104" height="342" fill="#eef2ee" stroke="#bcccbc" stroke-width="1.5"/>
  <text x="202" y="290" text-anchor="middle" font-size="12" fill="#4f7a4f" transform="rotate(-90 202 290)">pasillo 2.60 → quincho</text>

  <!-- ================= RIGHT STRIP (garage + passage) ================= -->
  <rect x="513" y="110" width="100" height="342" fill="#eeece2" stroke="#cbc7ac" stroke-width="1.5"/>
  <text x="563" y="300" text-anchor="middle" font-size="12" fill="#8a7c3c" transform="rotate(-90 563 300)">garage + paso 2.50 → quincho</text>

  <!-- ================= HOUSE (fill, no stroke; walls drawn explicitly) ================= -->
  <rect x="254" y="110" width="259" height="342" fill="#ece7dd"/>
  <!-- galeria open porch floor -->
  <rect x="390" y="384" width="123" height="68" fill="#f4efe6"/>
  <!-- SALA room fill -->
  <rect x="261" y="251" width="120" height="194" fill="#e2ebf0"/>
  <!-- 1er DORMITORIO fill -->
  <rect x="390" y="258" width="120" height="126" fill="#e3ede2"/>
  <!-- 2do DORMITORIO fill -->
  <rect x="390" y="132" width="120" height="126" fill="#dbe7d9"/>
  <!-- BANO + PASILLO + LAVADERO fills -->
  <rect x="261" y="193" width="80" height="58" fill="#dbeaea"/>
  <rect x="341" y="193" width="49" height="58" fill="#efe9dc"/>
  <rect x="261" y="133" width="129" height="60" fill="#e6ddec"/>

  <!-- solid outer walls -->
  <g stroke="#8f8677" stroke-width="2.5" fill="none">
    <line x1="254" y1="110" x2="254" y2="452"/>          <!-- left -->
    <line x1="254" y1="110" x2="513" y2="110"/>          <!-- back -->
    <line x1="513" y1="110" x2="513" y2="384"/>          <!-- right (solid up to galeria) -->
    <line x1="390" y1="384" x2="513" y2="384"/>          <!-- galeria back wall -->
    <line x1="390" y1="384" x2="390" y2="452"/>          <!-- wall room / galeria -->
    <line x1="254" y1="452" x2="390" y2="452"/>          <!-- front wall of left volume -->
  </g>

  <!-- SALA interior partitions -->
  <g stroke="#8f8677" stroke-width="2" fill="none">
    <line x1="381" y1="251" x2="381" y2="263"/>          <!-- right partition (upper) -->
    <line x1="381" y1="295" x2="381" y2="445"/>          <!-- right partition (lower) -->
    <line x1="261" y1="251" x2="337" y2="251"/>          <!-- baño front wall (solid) -->
  </g>

  <!-- VANO: right side of galeria is OPEN (no wall) -->
  <line x1="513" y1="384" x2="513" y2="442" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="527" y="416" font-size="11" fill="#c0392b" transform="rotate(-90 527 416)">vano (abierto)</text>

  <!-- pillar 0.25 at outer front-right corner -->
  <rect x="503" y="442" width="10" height="10" fill="#6f675a"/>
  <text x="527" y="452" font-size="10" fill="#6f675a">pilar</text>

  <!-- window on front wall of left volume (1.60, centered) -->
  <rect x="290" y="449" width="64" height="6" fill="#2f3a43"/>
  <text x="322" y="466" text-anchor="middle" font-size="10" fill="#555">ventana 1.60</text>

  <!-- SALA label -->
  <text x="321" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f5b6b">SALA</text>
  <text x="321" y="362" text-anchor="middle" font-size="12" fill="#3f5b6b">4.85 × 3.00</text>

  <!-- ABERTURA (0.80): opening in sala back wall, right of murito, to the pasillo -->
  <line x1="343" y1="251" x2="375" y2="251" stroke="#3f8f5a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="375" y1="251" x2="381" y2="251" stroke="#8f8677" stroke-width="2.5"/>
  <text x="359" y="243" text-anchor="middle" font-size="8" fill="#3f8f5a">abertura 0.80</text>

  <!-- MURITO projecting 0.60 into sala, 1.90 m from left wall (left jamb of abertura) -->
  <rect x="337" y="251" width="6" height="24" fill="#b98a52" stroke="#8a5a24" stroke-width="0.8"/>
  <text x="336" y="266" text-anchor="end" font-size="8.5" fill="#8a5a24">murito 0.60</text>
  <g stroke="#8a5a24" stroke-width="0.8" fill="#8a5a24" font-size="8">
    <line x1="261" y1="289" x2="343" y2="289"/>
    <line x1="261" y1="285" x2="261" y2="293"/>
    <line x1="337" y1="285" x2="337" y2="293"/>
    <text x="299" y="284" text-anchor="middle">1.90 (desde izq.)</text>
  </g>

  <!-- SIDE WINDOW in sala left wall: 1.00 x 0.90, 3.50 m from front wall -->
  <rect x="253" y="272" width="8" height="40" fill="#cfe0e8" stroke="#7f97a3" stroke-width="1"/>
  <line x1="253" y1="292" x2="261" y2="292" stroke="#7f97a3" stroke-width="0.8"/>
  <text x="298" y="296" font-size="9" fill="#3f5b6b">vent. 1.00×0.90</text>
  <g stroke="#3f5b6b" stroke-width="0.8" fill="#3f5b6b" font-size="8">
    <line x1="271" y1="312" x2="271" y2="452"/>
    <line x1="267" y1="312" x2="275" y2="312"/>
    <line x1="267" y1="452" x2="275" y2="452"/>
    <text x="271" y="392" text-anchor="middle" transform="rotate(-90 271 392)">3.50 al frente</text>
  </g>

  <!-- galeria label -->
  <text x="455" y="415" text-anchor="middle" font-size="11" fill="#8a8270">galería</text>
  <text x="455" y="429" text-anchor="middle" font-size="9" fill="#a89b82">(abierta)</text>

  <!-- ENTRANCE DOOR: left wall of galeria (sala/galeria partition), 0.25 m from front filo -->
  <rect x="379" y="409" width="13" height="34" fill="#eaf0f3"/>
  <line x1="381" y1="442" x2="349" y2="442" stroke="#5b5b5b" stroke-width="2"/>
  <path d="M349,442 A 32 32 0 0 1 381,410" fill="none" stroke="#b3b3b3" stroke-width="1"/>
  <text x="352" y="404" text-anchor="middle" font-size="9" fill="#c0392b">acceso</text>
  <g stroke="#c0392b" stroke-width="0.8" fill="#c0392b" font-size="8">
    <line x1="397" y1="442" x2="397" y2="452"/>
    <line x1="393" y1="442" x2="401" y2="442"/>
    <line x1="393" y1="452" x2="401" y2="452"/>
    <text x="405" y="450" text-anchor="start">0.25</text>
  </g>

  <!-- DOOR to first bedroom (from sala), near the wall between bedrooms -->
  <rect x="378" y="263" width="12" height="32" fill="#eeede4"/>
  <line x1="381" y1="295" x2="413" y2="295" stroke="#5b5b5b" stroke-width="2"/>
  <path d="M413,295 A 32 32 0 0 0 381,263" fill="none" stroke="#b3b3b3" stroke-width="1"/>
  <text x="452" y="287" text-anchor="middle" font-size="8.5" fill="#7a5a2a">puerta 1er dorm.</text>

  <!-- DOOR to second bedroom (from pasillo), 0.25 m from the first -->
  <rect x="384" y="221" width="12" height="32" fill="#eeede4"/>
  <line x1="390" y1="221" x2="422" y2="221" stroke="#5b5b5b" stroke-width="2"/>
  <path d="M422,221 A 32 32 0 0 1 390,253" fill="none" stroke="#b3b3b3" stroke-width="1"/>
  <text x="452" y="235" text-anchor="middle" font-size="8.5" fill="#4f6b4a">puerta 2º dorm.</text>

  <!-- 0.25 m between the two bedroom doors (5 + 15 wall + 5) -->
  <g stroke="#a8461f" stroke-width="0.8" fill="#a8461f" font-size="8">
    <line x1="424" y1="253" x2="436" y2="253"/>
    <line x1="424" y1="263" x2="436" y2="263"/>
    <line x1="430" y1="253" x2="430" y2="263"/>
    <text x="440" y="261" text-anchor="start">0.25 (5+15+5)</text>
  </g>

  <!-- 2.95 m from main door to 1st bedroom door (independent measure) -->
  <g stroke="#7a5a2a" stroke-width="0.8" fill="#7a5a2a" font-size="8">
    <line x1="356" y1="295" x2="368" y2="295"/>
    <line x1="356" y1="410" x2="368" y2="410"/>
    <line x1="362" y1="295" x2="362" y2="410"/>
    <text x="362" y="353" text-anchor="middle" transform="rotate(-90 362 353)">2.95 a puerta ppal.</text>
  </g>

  <!-- FIRST BEDROOM (right side): 3.15 (fondo) x 3.00 (ancho) -->
  <g stroke="#7a8a6f" stroke-width="2" fill="none">
    <line x1="390" y1="258" x2="510" y2="258"/>   <!-- back wall -->
    <line x1="510" y1="258" x2="510" y2="384"/>   <!-- right wall (inner face of ext. wall) -->
  </g>
  <!-- window centered on right wall, 1.00 x 0.90 -->
  <rect x="507" y="301" width="9" height="40" fill="#cfe0e8" stroke="#7f97a3" stroke-width="1"/>
  <line x1="507" y1="321" x2="516" y2="321" stroke="#7f97a3" stroke-width="0.8"/>
  <text x="500" y="356" text-anchor="end" font-size="8.5" fill="#4f6b4a">vent. 1.00×0.90</text>
  <!-- labels -->
  <text x="450" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#4f6b4a">1er DORM.</text>
  <text x="450" y="333" text-anchor="middle" font-size="11" fill="#4f6b4a">3.15 × 3.00</text>
  <!-- dims: fondo 3.15 (right side) and ancho 3.00 (top) -->
  <g stroke="#4f6b4a" stroke-width="0.8" fill="#4f6b4a" font-size="8">
    <line x1="524" y1="258" x2="534" y2="258"/>
    <line x1="524" y1="384" x2="534" y2="384"/>
    <line x1="529" y1="258" x2="529" y2="384"/>
    <text x="537" y="321" text-anchor="middle" transform="rotate(-90 537 321)">3.15</text>
    <line x1="390" y1="250" x2="390" y2="242"/>
    <line x1="510" y1="250" x2="510" y2="242"/>
    <line x1="390" y1="246" x2="510" y2="246"/>
    <text x="450" y="240" text-anchor="middle">3.00</text>
  </g>

  <!-- SECOND BEDROOM (contiguous, behind first): 3.15 x 3.00, window to quincho -->
  <g stroke="#7a8a6f" stroke-width="2" fill="none">
    <line x1="390" y1="132" x2="510" y2="132"/>   <!-- back wall (to quincho) -->
    <line x1="390" y1="132" x2="390" y2="221"/>   <!-- left wall (upper) -->
    <line x1="390" y1="253" x2="390" y2="258"/>   <!-- left wall (stub, door gap above) -->
    <line x1="510" y1="132" x2="510" y2="258"/>   <!-- right wall -->
  </g>
  <!-- window on back wall, 1.80 x 1.00, facing quincho -->
  <rect x="414" y="128" width="72" height="8" fill="#cfe0e8" stroke="#7f97a3" stroke-width="1"/>
  <line x1="450" y1="128" x2="450" y2="136" stroke="#7f97a3" stroke-width="0.8"/>
  <text x="450" y="122" text-anchor="middle" font-size="8.5" fill="#4f6b4a">ventana 1.80×1.00 (al quincho)</text>
  <!-- labels -->
  <text x="450" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#4f6b4a">2º DORM.</text>
  <text x="450" y="207" text-anchor="middle" font-size="11" fill="#4f6b4a">3.15 × 3.00</text>
  <g stroke="#4f6b4a" stroke-width="0.8" fill="#4f6b4a" font-size="8">
    <line x1="524" y1="132" x2="534" y2="132"/>
    <line x1="524" y1="258" x2="534" y2="258"/>
    <line x1="529" y1="132" x2="529" y2="258"/>
    <text x="537" y="195" text-anchor="middle" transform="rotate(-90 537 195)">3.15</text>
  </g>

  <!-- BANO: 2.00 (ancho) x 1.45 (fondo), starts at the murito wall -->
  <g stroke="#7a8a8a" stroke-width="2" fill="none">
    <line x1="261" y1="193" x2="341" y2="193"/>   <!-- back wall -->
    <line x1="341" y1="193" x2="341" y2="223"/>   <!-- right wall; door gap y223-251 (to pasillo) -->
  </g>
  <rect x="257" y="206" width="7" height="32" fill="#cfe0e8" stroke="#7f97a3" stroke-width="1"/>
  <!-- BAÑO door 0.70, on the pasillo side (right wall), opens to the pasillo -->
  <rect x="339" y="223" width="4" height="28" fill="#eaf0f2"/>
  <line x1="341" y1="251" x2="313" y2="251" stroke="#5b5b5b" stroke-width="2"/>
  <path d="M313,251 A 28 28 0 0 1 341,223" fill="none" stroke="#b3b3b3" stroke-width="1"/>
  <text x="301" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b6b">BAÑO</text>
  <text x="301" y="234" text-anchor="middle" font-size="9" fill="#3f6b6b">2.00 × 1.45</text>
  <text x="301" y="247" text-anchor="middle" font-size="7.5" fill="#3f6b6b">vent. 0.80×0.40 (izq.)</text>

  <!-- PASILLO label (corridor y193..251 between bano and bedrooms) -->
  <text x="366" y="224" text-anchor="middle" font-size="9" fill="#7a745f" transform="rotate(-90 366 224)">pasillo</text>

  <!-- LAVADERO: contiguo al bano, 1.50 fondo, hasta el 2do dormitorio -->
  <g stroke="#8a7a9a" stroke-width="2" fill="none">
    <line x1="261" y1="133" x2="356" y2="133"/>   <!-- back wall (left part) -->
    <line x1="388" y1="133" x2="390" y2="133"/>   <!-- back wall (right stub) -->
  </g>
  <!-- abertura al quincho (0.80), pegada al dormitorio -->
  <line x1="356" y1="133" x2="388" y2="133" stroke="#3f8f5a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="372" y="126" text-anchor="middle" font-size="7.5" fill="#3f8f5a">abertura 0.80 al quincho</text>
  <text x="322" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5a7a">LAVADERO</text>
  <text x="322" y="176" text-anchor="middle" font-size="9" fill="#6b5a7a">1.50 fondo</text>

  <!-- FRENTE label -->
  <text x="381" y="770" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">FRENTE (calle) ↓</text>

  <!-- ================= WIDTH DIMENSIONS (top) ================= -->
  <g stroke="#444" stroke-width="1" fill="#333" font-size="12">
    <line x1="150" y1="92" x2="150" y2="78"/>
    <line x1="254" y1="92" x2="254" y2="78"/>
    <line x1="513" y1="92" x2="513" y2="78"/>
    <line x1="613" y1="92" x2="613" y2="78"/>
    <line x1="150" y1="85" x2="254" y2="85"/>
    <line x1="254" y1="85" x2="513" y2="85"/>
    <line x1="513" y1="85" x2="613" y2="85"/>
    <text x="202" y="74" text-anchor="middle">2.60</text>
    <text x="383" y="74" text-anchor="middle" font-weight="bold">6.47 (casa)</text>
    <text x="563" y="74" text-anchor="middle">2.50</text>
  </g>

  <!-- ================= DEPTH DIMENSIONS (left) ================= -->
  <g stroke="#444" stroke-width="1" fill="#333" font-size="12">
    <line x1="130" y1="110" x2="116" y2="110"/>
    <line x1="130" y1="452" x2="116" y2="452"/>
    <line x1="123" y1="110" x2="123" y2="452"/>
    <text x="112" y="285" text-anchor="middle" font-weight="bold" transform="rotate(-90 112 285)">8.55 (fondo casa)</text>
    <line x1="130" y1="452" x2="116" y2="452"/>
    <line x1="130" y1="742" x2="116" y2="742"/>
    <line x1="123" y1="452" x2="123" y2="742"/>
    <text x="112" y="597" text-anchor="middle" font-weight="bold" transform="rotate(-90 112 597)">7.25 (retiro)</text>
  </g>

  <!-- SALA depth dim 4.85 -->
  <g stroke="#3f5b6b" stroke-width="1" fill="#3f5b6b" font-size="10">
    <line x1="243" y1="251" x2="231" y2="251"/>
    <line x1="243" y1="445" x2="231" y2="445"/>
    <line x1="237" y1="251" x2="237" y2="445"/>
    <text x="228" y="348" text-anchor="middle" transform="rotate(-90 228 348)">4.85</text>
  </g>
  <!-- SALA width dim 3.00 -->
  <g stroke="#3f5b6b" stroke-width="1" fill="#3f5b6b" font-size="10">
    <line x1="261" y1="238" x2="261" y2="248"/>
    <line x1="381" y1="238" x2="381" y2="248"/>
    <line x1="261" y1="243" x2="381" y2="243"/>
    <text x="321" y="240" text-anchor="middle">3.00</text>
  </g>

  <!-- galeria depth 1.70 (right of house) -->
  <g stroke="#666" stroke-width="1" fill="#666" font-size="10">
    <line x1="524" y1="384" x2="536" y2="384"/>
    <line x1="524" y1="452" x2="536" y2="452"/>
    <line x1="530" y1="384" x2="530" y2="452"/>
    <text x="544" y="422" text-anchor="middle" transform="rotate(-90 544 422)">1.70 galería</text>
  </g>

  <!-- lot total width dim (bottom of patio) -->
  <g stroke="#444" stroke-width="1" fill="#333" font-size="12">
    <line x1="150" y1="752" x2="150" y2="766"/>
    <line x1="613" y1="752" x2="613" y2="766"/>
    <line x1="150" y1="759" x2="613" y2="759"/>
    <text x="381" y="755" text-anchor="middle" fill="#a8461f">ancho lote ≈ 11.57 m</text>
  </g>

  <!-- notes -->
  <g font-size="12" fill="#555">
    <rect x="130" y="790" width="520" height="42" fill="#f6f4ef" stroke="#ddd"/>
    <text x="142" y="808">SALA (living) 4.85 × 3.00 con la ventana. Acceso a la casa por la izquierda, directo a la sala,</text>
    <text x="142" y="825">a 0.25 m del filo del frente. Galería abierta al lateral. Resto del interior pendiente de relevar.</text>
  </g>
</svg>
