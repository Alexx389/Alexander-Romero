<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 840" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="840" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Casa de la "Y" — Planta de contorno (huella)</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#777">Medidas en metros · Divisiones interiores pendientes</text>

  <text x="662" y="105" font-size="12" fill="#3a7d3a" font-weight="bold">↑ al quincho</text>

  <!-- ================= FRONT PATIO (retiro) ================= -->
  <rect x="150" y="452" width="463" height="290" fill="#ece2cf" stroke="#cdbfa3" stroke-width="1.5"/>
  <text x="381" y="600" text-anchor="middle" font-size="13" fill="#8a7c5c">patio / retiro frontal</text>

  <!-- ================= LEFT PASSAGE ================= -->
  <rect x="150" y="110" width="104" height="342" fill="#eef2ee" stroke="#bcccbc" stroke-width="1.5"/>
  <text x="202" y="290" text-anchor="middle" font-size="12" fill="#4f7a4f" transform="rotate(-90 202 290)">pasillo 2.60 → quincho</text>

  <!-- ================= RIGHT STRIP (garage + passage) ================= -->
  <rect x="513" y="110" width="100" height="342" fill="#eeece2" stroke="#cbc7ac" stroke-width="1.5"/>
  <text x="563" y="290" text-anchor="middle" font-size="12" fill="#8a7c3c" transform="rotate(-90 563 290)">garage + paso 2.50 → quincho</text>

  <!-- ================= HOUSE BLOCK 6.47 x 8.55 ================= -->
  <rect x="254" y="110" width="259" height="342" fill="#ece7dd" stroke="#8f8677" stroke-width="2.5"/>

  <!-- left volume / galeria split line (front) -->
  <line x1="390" y1="384" x2="390" y2="452" stroke="#b3aa98" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- galeria (open porch) front-right, 2.85 x 1.70 -->
  <rect x="390" y="384" width="114" height="68" fill="#f4efe6" stroke="#b3aa98" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="447" y="422" text-anchor="middle" font-size="11" fill="#8a8270">galería</text>
  <!-- pillar 0.25 at front-right corner of galeria -->
  <rect x="503" y="442" width="10" height="10" fill="#6f675a"/>

  <!-- window on front wall of left volume (1.60, centered) -->
  <rect x="290" y="449" width="64" height="6" fill="#2f3a43"/>
  <text x="322" y="440" text-anchor="middle" font-size="10" fill="#555">ventana</text>

  <text x="322" y="250" text-anchor="middle" font-size="12" fill="#8a8270">interior</text>
  <text x="322" y="268" text-anchor="middle" font-size="11" fill="#b0a894">(a relevar)</text>

  <!-- FRENTE label -->
  <text x="381" y="770" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">FRENTE (calle) ↓</text>

  <!-- ================= WIDTH DIMENSIONS (top) ================= -->
  <g stroke="#444" stroke-width="1" fill="#333" font-size="12">
    <line x1="150" y1="92" x2="150" y2="78"/>
    <line x1="254" y1="92" x2="254" y2="78"/>
    <line x1="513" y1="92" x2="513" y2="78"/>
    <line x1="613" y1="92" x2="613" y2="78"/>
    <line x1="150" y1="85" x2="254" y2="85"/>
    <line x1="254" y1="85" x2="513" y2="85"/>
    <line x1="513" y1="85" x2="613" y2="85"/>
    <text x="202" y="74" text-anchor="middle">2.60</text>
    <text x="383" y="74" text-anchor="middle" font-weight="bold">6.47 (casa)</text>
    <text x="563" y="74" text-anchor="middle">2.50</text>
  </g>

  <!-- ================= FRENTE sub-dims (below house front) ================= -->
  <g stroke="#444" stroke-width="1" fill="#333" font-size="11">
    <line x1="254" y1="462" x2="254" y2="476"/>
    <line x1="390" y1="462" x2="390" y2="476"/>
    <line x1="504" y1="462" x2="504" y2="476"/>
    <line x1="254" y1="469" x2="390" y2="469"/>
    <line x1="390" y1="469" x2="504" y2="469"/>
    <text x="322" y="489" text-anchor="middle">3.40</text>
    <text x="447" y="489" text-anchor="middle">2.85</text>
    <text x="560" y="489" text-anchor="start" fill="#999">(luz 6.25; +0.22 muros)</text>
  </g>

  <!-- ================= DEPTH DIMENSIONS (left) ================= -->
  <g stroke="#444" stroke-width="1" fill="#333" font-size="12">
    <line x1="130" y1="110" x2="116" y2="110"/>
    <line x1="130" y1="452" x2="116" y2="452"/>
    <line x1="123" y1="110" x2="123" y2="452"/>
    <text x="112" y="285" text-anchor="middle" font-weight="bold" transform="rotate(-90 112 285)">8.55 (fondo casa)</text>
    <line x1="130" y1="452" x2="116" y2="452"/>
    <line x1="130" y1="742" x2="116" y2="742"/>
    <line x1="123" y1="452" x2="123" y2="742"/>
    <text x="112" y="597" text-anchor="middle" font-weight="bold" transform="rotate(-90 112 597)">7.25 (retiro)</text>
  </g>

  <!-- lot total width dim (bottom of patio) -->
  <g stroke="#444" stroke-width="1" fill="#333" font-size="12">
    <line x1="150" y1="752" x2="150" y2="766"/>
    <line x1="613" y1="752" x2="613" y2="766"/>
    <line x1="150" y1="759" x2="613" y2="759"/>
    <text x="381" y="755" text-anchor="middle" fill="#a8461f">ancho lote ≈ 11.57 m</text>
  </g>

  <!-- notes -->
  <g font-size="12" fill="#555">
    <rect x="130" y="790" width="500" height="42" fill="#f6f4ef" stroke="#ddd"/>
    <text x="142" y="808">Contorno a escala con lo medido. Las divisiones interiores se dibujan tras el</text>
    <text x="142" y="825">relevamiento con medidas de cada ambiente.</text>
  </g>
</svg>
