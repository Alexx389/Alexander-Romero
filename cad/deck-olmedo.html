<style>
  :root{ --acc:#4f7fb0; }
  *{box-sizing:border-box;} html,body{margin:0;height:100%;}
  .deck{ position:relative; min-height:100svh; overflow:hidden;

  .stage{ flex:1; display:grid; grid-template-columns:minmax(240px,.75fr) 1.6fr; gap:clamp(16px,3vw,40px); align-items:center; padding:clamp(16px,3vw,40px); }

  .chip{ font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;

  .chip[aria-pressed="true"]{ background:var(--acc); border-color:var(--acc); color:var(--paper); font-weight:700; }
  .chip:hover{ border-color:var(--acc); }
  .sp{ flex:1; }
  .nav{ display:flex; align-items:center; gap:10px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .nav button{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; font-size:16px; transition:.2s; }
  .nav button:hover{ border-color:var(--acc); color:var(--acc); }

  const VIEWS=[{"plan": "PA", "vbx": null, "num": "01", "tit": "Planta Alta", "sub": "Nivel superior · 4 departamentos", "cap": "Cuatro unidades espejadas de a pares. Escalera central de acceso. Envolvente 24.00 × 12.90 m."}, {"plan": "PA", "vbx": [17707.2, 132536.2, 247455.5, 538463.2], "num": "02", "tit": "Unidad tipo", "sub": "Departamento de 2 dormitorios", "cap": "La unidad se organiza en franjas: al frente cocina y comedor integrados; en el medio sala y baño; al fondo, dos dormitorios. El área húmeda (cocina · lavadero · baño) se alinea sobre un mismo eje para concentrar instalaciones."}, {"plan": "PA", "vbx": [83035.5, 132536.2, 182127.2, 273190.9], "num": "03", "tit": "Cocina · Comedor · Sala", "sub": "Núcleo social integrado · frente 4.08 m", "cap": "Ambiente único de 4.08 m de frente: la cocina se apoya sobre el muro húmedo (mesada, anafe y heladera) y se abre al comedor y a la sala. La continuidad visual amplía el espacio y favorece la ventilación cruzada hacia el frente."}, {"plan": "PA", "vbx": [13747.9, 132536.2, 85124.7, 178168.0], "num": "04", "tit": "Lavadero", "sub": "Servicio · frente 1.49 m", "cap": "Lavadero compacto contiguo a la cocina, sobre el muro de instalaciones. Aloja pileta y lavarropas, con acceso directo desde el área de cocina."}, {"plan": "PA", "vbx": [13747.9, 286948.4, 85124.7, 160351.2], "num": "05", "tit": "Baño", "sub": "Completo · profundidad 2.44 m", "cap": "Baño alineado con cocina y lavadero para compartir instalaciones sanitarias. Inodoro, bacha y ducha con blindex. Puerta de 0.70 m desde la circulación interna."}, {"plan": "PA", "vbx": [126587.6, 385930.6, 138575.1, 289028.0], "num": "06", "tit": "Dormitorio 1", "sub": "Principal · frente 2.78 m", "cap": "Dormitorio principal al fondo de la unidad. Espacio para cama de dos plazas y placard, con ventana de 1.50 × 2.10 m al contrafrente para luz y ventilación natural. Puerta de 0.80 m."}, {"plan": "PA", "vbx": [13747.9, 385930.6, 120758.3, 289028.0], "num": "07", "tit": "Dormitorio 2", "sub": "Secundario · frente 2.82 m", "cap": "Segundo dormitorio con dos camas y placard. Comparte el muro de fondo y recibe luz y ventilación por ventana de 1.50 × 2.10 m al contrafrente. Puerta de 0.80 m."}, {"plan": "PB", "vbx": null, "num": "08", "tit": "Planta Baja", "sub": "Nivel acceso · salón comercial + estacionamiento", "cap": "Dos salones comerciales con accesos independientes (entrada 1 y 2), módulos de estacionamiento y servicios existentes. Linderos acotados: 24.00 × 28.20 m."}], N=VIEWS.length;
  const PAfull="0 0 1000000 654762", PBfull="0 0 868966 1000000";
  const planPA=document.getElementById('planPA'), planPB=document.getElementById('planPB');
  let i=0;
  function show(k){ i=(k+N)%N; const v=VIEWS[i];
    document.getElementById('num').firstChild.textContent=v.num;
    document.getElementById('tit').textContent=v.tit;
    document.getElementById('sub').textContent=v.sub;
    document.getElementById('cap').textContent=v.cap;
    document.getElementById('count').textContent=v.num+' / '+String(N).padStart(2,'0');
    const usePA=v.plan==='PA';
    planPA.classList.toggle('on',usePA); planPB.classList.toggle('on',!usePA);
    (usePA?planPA:planPB).setAttribute('viewBox', v.vbx? v.vbx.join(' ') : (usePA?PAfull:PBfull));
  }
  document.getElementById('prev').onclick=()=>show(i-1);
  document.getElementById('next').onclick=()=>show(i+1);
  addEventListener('keydown',e=>{ if(e.key==='ArrowRight')show(i+1); if(e.key==='ArrowLeft')show(i-1); });
  const deck=document.getElementById('deck');
  const chips=[...document.querySelectorAll('.chip[data-c]')];
  chips.forEach(c=>c.onclick=()=>{ chips.forEach(x=>x.setAttribute('aria-pressed','false'));
    c.setAttribute('aria-pressed','true'); document.documentElement.style.setProperty('--acc',c.dataset.c); });
  const mb=document.getElementById('mode');
  mb.onclick=()=>{ const m=deck.getAttribute('data-mode')==='dark'?'light':'dark';
    deck.setAttribute('data-mode',m); mb.textContent=m==='dark'?'Modo claro':'Modo oscuro'; };
  show(0);
</script>
